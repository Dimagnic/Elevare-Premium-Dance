<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Volvemos pronto — Elevare Premium Dance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      background: #0a0a0a;
      font-family: system-ui, sans-serif;
      text-align: center; padding: 2rem;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 100px; padding: 6px 14px;
      font-size: 12px; color: rgba(255,255,255,0.6);
      letter-spacing: 0.05em; text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #f59e0b;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    h1 { font-size: 42px; font-weight: 500; color: #fff; margin-bottom: 1rem; }
    p { font-size: 16px; color: rgba(255,255,255,0.5); max-width: 400px; line-height: 1.7; margin-bottom: 2.5rem; }
    .brand { font-size: 13px; color: rgba(255,255,255,0.25); margin-top: 3rem; letter-spacing: 0.1em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="badge"><span class="dot"></span> Mantenimiento</div>
  <h1>Volvemos pronto ✦</h1>
  <p>Estamos trabajando para mejorar tu experiencia. Regresa en unos momentos.</p>
  <div class="brand">Elevare Premium Dance</div>
</body>
</html>
